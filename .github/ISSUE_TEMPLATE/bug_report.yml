name: Bug report
description: Report a problem with VGTranslate
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Fill in what you can - the more detail, the faster we can help.

        Please check the [docs](https://github.com/velteyn/vgtranslate/tree/master/docs)
        and existing issues first. For security problems, do **not** use this form -
        report privately via Security Advisories (see SECURITY.md).
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, how you installed (install.bat / pip and which extras), and which engines are available.
      placeholder: |
        OS: Windows 11 / Ubuntu 24.04
        Python: 3.14
        Installed extras: [ocr,tray]
        `vgtranslate status` output:
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Game, screenshot or frame, config profile, and the exact command or request that triggers it.
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs / config
      description: Paste relevant output (e.g. from `vgtranslate serve` or `run.bat`) and your config. Remove any API keys or tokens first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the docs and this is not covered
        - label: I can reproduce the issue consistently
