[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgtranslate"
version = "2.0.0"
description = "Local-first RetroArch AI Service translator: Japanese game text to an English overlay, powered by a vision LLM (quality) or OCR + machine translation (fast)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vgtranslate contributors" }]
keywords = ["retroarch", "translation", "ocr", "llm", "game"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
ocr-manga = ["manga-ocr>=0.1"]
mt-sugoi = ["sugoi[ja_zh2en]>=0.6"]
mt-argos = ["argostranslate>=1.9"]
tesseract = ["pytesseract>=0.3"]
tray = ["pystray>=0.19"]
dev = ["pytest>=8", "ruff>=0.4"]
all = [
    "rapidocr-onnxruntime>=1.3",
    "manga-ocr>=0.1",
    "sugoi[ja_zh2en]>=0.6",
    "argostranslate>=1.9",
    "pytesseract>=0.3",
    "pystray>=0.19",
]

[project.scripts]
vgtranslate = "vgtranslate.__main__:main"

[tool.setuptools.packages.find]
include = ["vgtranslate*"]

[tool.setuptools.package-data]
vgtranslate = ["fonts/*.ttf"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
